<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gestión del taller{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f4;
            color: #222;
        }

        header, main, footer {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
        }

        header {
            border-bottom: 1px solid #ddd;
        }

        footer {
            border-top: 1px solid #ddd;
            font-size: 14px;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #bbb;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #e9e9e9;
        }

        a {
            color: #0645ad;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .mensaje {
            padding: 12px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            margin-top: 15px;
        }

        nav a {
            margin-right: 12px;
        }

        .campo-formulario {
            margin-bottom: 14px;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            max-width: 480px;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #bbb;
            border-radius: 4px;
        }

        button {
            padding: 10px 18px;
            border: 0;
            background-color: #0645ad;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #04337f;
        }

        .error {
            color: #b00020;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Gestión del taller de coches</h1>
        <nav>
            <a href="{% url 'lista_clientes' %}">Clientes</a>
            <a href="{% url 'nuevo_cliente' %}">Nuevo cliente</a>
            <a href="{% url 'nuevo_coche' %}">Nuevo coche</a>
            <a href="{% url 'nuevo_servicio' %}">Nuevo servicio</a>
            <a href="{% url 'nuevo_coche_servicio' %}">Asignar servicio</a>
            <a href="{% url 'contacto' %}">Contacto</a>
        </nav>
    </header>

    <main>
        {% block contenido %}{% endblock %}
    </main>

    <footer>
        <p>Práctica 6 - Formularios en Django | Javier Blanco Vila</p>
    </footer>
</body>
</html>
